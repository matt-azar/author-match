[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "author-match"
version = "0.2.0"
description = "Pairwise authorship verification for informal English writing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3,<2", "joblib>=1.3"]

[project.optional-dependencies]
neural = ["torch>=2.6", "transformers>=4.48,<5"]

[project.scripts]
author-match = "author_match.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
